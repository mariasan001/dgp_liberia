<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Gob UI · HTML listo</title>

    <link rel="stylesheet" href="../../node_modules/@mariasan001/styles/fonts.css" />
    <link rel="stylesheet" href="../../node_modules/@mariasan001/styles/theme.css" />
    <link rel="stylesheet" href="../../node_modules/@mariasan001/styles/base.css" />
    <link rel="stylesheet" href="../../node_modules/@mariasan001/styles/utilities.css" />
    <script type="module" src="../../node_modules/@mariasan001/ui-wc/dist/index.js"></script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(700px 320px at 90% -10%, rgba(159, 33, 65, 0.07), transparent 55%),
          var(--gob-bg, #fafafa);
      }
      .stage {
        width: min(720px, calc(100% - 32px));
        margin: 0 auto;
        padding: 48px 0 64px;
        display: grid;
        gap: 20px;
      }
      .badge {
        display: inline-flex;
        width: fit-content;
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(159, 33, 65, 0.1);
        color: #9f2141;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
    </style>
  </head>

  <body>
    <main class="stage gob-stack">
      <span class="badge">Inicio fácil</span>
      <h1 style="margin: 0; font-size: clamp(1.8rem, 4vw, 2.4rem); letter-spacing: -0.03em">
        Gob UI en HTML
      </h1>
      <p class="gob-muted" style="margin: 0; max-width: 48ch; line-height: 1.55">
        Si ves estos botones con la marca, ¡ya estás listo! Edita este archivo,
        guarda y recarga.
      </p>

      <div class="gob-row" style="flex-wrap: wrap; gap: 10px">
        <gob-button tone="primary" appearance="solid">Guardar</gob-button>
        <gob-button tone="primary" appearance="outline">Revisar</gob-button>
        <gob-button tone="accent" appearance="solid">Continuar</gob-button>
        <gob-button tone="neutral" appearance="ghost">Consultar</gob-button>
      </div>

      <gob-alert
        tone="info"
        title="¿Y ahora?"
        description="Corre pnpm dev para ver el catálogo, o abre Instalación para más detalle."
      ></gob-alert>
    </main>
  </body>
</html>
